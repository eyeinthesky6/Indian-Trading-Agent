name: level1-network-smoke

on:
  workflow_dispatch:

jobs:
  nse-bhavcopy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Parse a real archived NSE UDiFF bhavcopy
        env:
          ITA_NETWORK_SMOKE: "1"
        run: python -m unittest tests.test_level1_network_smoke -v
